version: '3.8'
services:
  db:
    image: postgis/postgis:15-3.4
    container_name: rakshanet_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rakshanet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data:
    driver: local
